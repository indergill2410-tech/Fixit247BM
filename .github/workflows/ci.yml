name: CI

on:
  push:
    branches: [main, develop, 'claude/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Minimal env for type-checking and linting (no real credentials needed)
  DATABASE_URL: "postgresql://postgres:password@localhost:5432/fixit247_ci"
  DIRECT_URL: "postgresql://postgres:password@localhost:5432/fixit247_ci"
  NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder"
  SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder"
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_placeholder"
  STRIPE_SECRET_KEY: "sk_test_placeholder"
  STRIPE_WEBHOOK_SECRET: "whsec_placeholder"
  OPENAI_API_KEY: "sk-placeholder"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  RESEND_API_KEY: "re_placeholder"
  EMAIL_FROM: "noreply@fixit247.com.au"

jobs:
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ hashFiles('pnpm-lock.yaml') }}

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install (if cache miss)
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @fixit247/database exec prisma generate
      - name: Type check all packages
        run: pnpm turbo type-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install (if cache miss)
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @fixit247/database exec prisma generate
      - name: Lint
        run: pnpm turbo lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - name: Restore node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: nm-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install (if cache miss)
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm --filter @fixit247/database exec prisma generate
      - name: Build all apps
        run: pnpm turbo build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: |
            apps/web/.next
            apps/admin/.next
          retention-days: 3
