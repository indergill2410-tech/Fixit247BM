services:
  # Web app (customer + tradie facing)
  - type: web
    name: fixit247-web
    runtime: node
    region: singapore
    plan: starter
    rootDir: .
    buildCommand: NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter @fixit247/web build
    startCommand: pnpm --filter @fixit247/web start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

  # Admin app
  - type: web
    name: fixit247-admin
    runtime: node
    region: singapore
    plan: starter
    rootDir: .
    buildCommand: NODE_ENV=development pnpm install --frozen-lockfile && pnpm --filter @fixit247/admin build
    startCommand: pnpm --filter @fixit247/admin start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
