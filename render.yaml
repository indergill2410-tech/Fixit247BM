services:
  # ── Web app (customer + tradie facing) ──────────────────────────────────────
  - type: web
    name: fixit247-web
    runtime: node
    region: singapore
    plan: starter
    rootDir: .
    buildCommand: >
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @fixit247/database run db:generate &&
      pnpm --filter @fixit247/web build
    startCommand: pnpm --filter @fixit247/web start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

      # ── Database (Supabase — set these manually in Render dashboard) ──
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # ── Supabase ──
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

      # ── App URLs ──
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_ADMIN_URL
        sync: false

      # ── Stripe ──
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_PLATFORM_FEE_PERCENT
        value: "15"

      # ── OpenAI ──
      - key: OPENAI_API_KEY
        sync: false

      # ── Email (Resend) ──
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@fixit247.com.au

      # ── Twilio (voice features) ──
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_FALLBACK_NUMBER
        sync: false

      # ── Google Maps ──
      - key: NEXT_PUBLIC_GOOGLE_MAPS_KEY
        sync: false

      # ── Redis (rate limiting / queues) ──
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # ── Sentry ──
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false

      # ── Stripe subscription prices ──
      - key: STRIPE_PRICE_BASIC
        sync: false
      - key: STRIPE_PRICE_PROFESSIONAL
        sync: false
      - key: STRIPE_PRICE_ELITE
        sync: false

      # ── Analytics pixels (optional) ──
      - key: NEXT_PUBLIC_GA_ID
        sync: false
      - key: NEXT_PUBLIC_META_PIXEL_ID
        sync: false
      - key: NEXT_PUBLIC_TIKTOK_PIXEL_ID
        sync: false

      # ── Socket / realtime ──
      - key: SOCKET_SECRET
        sync: false
      - key: NEXT_PUBLIC_SOCKET_URL
        sync: false

  # ── Admin app ───────────────────────────────────────────────────────────────
  - type: web
    name: fixit247-admin
    runtime: node
    region: singapore
    plan: starter
    rootDir: .
    buildCommand: >
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @fixit247/database run db:generate &&
      pnpm --filter @fixit247/admin build
    startCommand: pnpm --filter @fixit247/admin start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

      # ── Database (Supabase — set these manually in Render dashboard) ──
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # ── Supabase ──
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false

      # ── App URLs ──
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false

      # ── Stripe ──
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_PLATFORM_FEE_PERCENT
        value: "15"

      # ── OpenAI ──
      - key: OPENAI_API_KEY
        sync: false

      # ── Email ──
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: noreply@fixit247.com.au

      # ── Twilio ──
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

      # ── Redis ──
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false

      # ── Sentry ──
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
